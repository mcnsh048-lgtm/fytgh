# Realistic Minecraft Shader Pack Configuration
# Version: 1.0
# Compatible with: Minecraft 26.1.2

# ============================================
# QUALITY PRESETS
# ============================================
screen=<Quality Presets>
option.QUALITY_PRESET=<default=1> <Fast Ultra High Medium Low>
option.QUALITY_PRESET.comment=Select the quality tier for your hardware

# Quality tier values
value.QUALITY_PRESET.0=Fast
value.QUALITY_PRESET.1=Ultra
value.QUALITY_PRESET.2=High
value.QUALITY_PRESET.3=Medium
value.QUALITY_PRESET.4=Low

# ============================================
# SHADOW SETTINGS
# ============================================
screen=<Shadow & Lighting>
option.SHADOW_QUALITY=<default=2> <Low Medium High Ultra>
option.SHADOW_QUALITY.comment=Shadow map resolution and filtering quality

value.SHADOW_QUALITY.0=Low (512px)
value.SHADOW_QUALITY.1=Medium (1024px)
value.SHADOW_QUALITY.2=High (2048px)
value.SHADOW_QUALITY.3=Ultra (4096px)

option.SHADOW_DISTANCE=<default=64> <16 32 64 128 256>
option.SHADOW_DISTANCE.comment=Shadow render distance in chunks

option.SHADOW_PCF=<default=true>
option.SHADOW_PCF.comment=Enable percentage-closer filtering for softer shadows

option.VOLUMETRIC_LIGHTING=<default=true>
option.VOLUMETRIC_LIGHTING.comment=Enable volumetric light rays (god rays)

option.VOLUMETRIC_SAMPLES=<default=16> <8 16 32 64>
option.VOLUMETRIC_SAMPLES.comment=Number of samples for volumetric effects

# ============================================
# AMBIENT OCCLUSION
# ============================================
screen=<Ambient Occlusion>
option.SSAO_ENABLED=<default=true>
option.SSAO_ENABLED.comment=Enable screen-space ambient occlusion

option.SSAO_RADIUS=<default=2> <1 2 4 8>
option.SSAO_RADIUS.comment=AO sampling radius

option.SSAO_SAMPLES=<default=8> <4 8 16 32>
option.SSAO_SAMPLES.comment=Number of AO samples

option.SSAO_INTENSITY=<default=1.0> <0.0 0.5 1.0 1.5 2.0>
option.SSAO_INTENSITY.comment=Overall AO intensity multiplier

# ============================================
# WATER SETTINGS
# ============================================
screen=<Water Rendering>
option.WATER_REFLECTIONS=<default=true>
option.WATER_REFLECTIONS.comment=Enable water reflections

option.WATER_REFRACTIONS=<default=true>
option.WATER_REFRACTIONS.comment=Enable water refractions

option.WATER_CAUSTICS=<default=true>
option.WATER_CAUSTICS.comment=Enable caustic effects underwater

option.WATER_PARALLAX=<default=true>
option.WATER_PARALLAX.comment=Enable parallax mapping for water surfaces

option.WATER_FOAM=<default=true>
option.WATER_FOAM.comment=Enable foam effects near shores and rapids

option.WATER_WAVE_STRENGTH=<default=1.0> <0.0 0.5 1.0 1.5 2.0>
option.WATER_WAVE_STRENGTH.comment=Water surface wave intensity

option.WATER_REFLECTIVITY=<default=0.5> <0.0 0.25 0.5 0.75 1.0>
option.WATER_REFLECTIVITY.comment=Water surface reflectivity

# ============================================
# SKY & ATMOSPHERE
# ============================================
screen=<Sky & Atmosphere>
option.SKY_QUALITY=<default=2> <Low Medium High Ultra>
option.SKY_QUALITY.comment=Sky rendering quality

value.SKY_QUALITY.0=Low
value.SKY_QUALITY.1=Medium
value.SKY_QUALITY.2=High
value.SKY_QUALITY.3=Ultra

option.CLOUD_QUALITY=<default=2> <Low Medium High Ultra>
option.CLOUD_QUALITY.comment=Cloud rendering quality and density

option.CLOUD_COVERAGE=<default=0.5> <0.0 0.25 0.5 0.75 1.0>
option.CLOUD_COVERAGE.comment=Cloud density multiplier

option.ATMOSPHERIC_SCATTERING=<default=true>
option.ATMOSPHERIC_SCATTERING.comment=Enable Rayleigh and Mie scattering

option.FOG_DENSITY=<default=1.0> <0.0 0.5 1.0 1.5 2.0>
option.FOG_DENSITY.comment=Fog density multiplier

option.SUN_INTENSITY=<default=1.0> <0.5 0.75 1.0 1.25 1.5>
option.SUN_INTENSITY.comment=Sun brightness multiplier

option.MOON_INTENSITY=<default=0.5> <0.0 0.25 0.5 0.75 1.0>
option.MOON_INTENSITY.comment=Moon brightness multiplier

# ============================================
# POST-PROCESSING
# ============================================
screen=<Post-Processing Effects>
option.BLOOM_ENABLED=<default=true>
option.BLOOM_ENABLED.comment=Enable bloom effect

option.BLOOM_STRENGTH=<default=1.0> <0.0 0.5 1.0 1.5 2.0>
option.BLOOM_STRENGTH.comment=Bloom intensity

option.BLOOM_RADIUS=<default=1.0> <0.5 1.0 1.5 2.0>
option.BLOOM_RADIUS.comment=Bloom blur radius

option.MOTION_BLUR=<default=false>
option.MOTION_BLUR.comment=Enable motion blur

option.MOTION_BLUR_STRENGTH=<default=0.5> <0.0 0.25 0.5 0.75 1.0>
option.MOTION_BLUR_STRENGTH.comment=Motion blur intensity

option.DEPTH_OF_FIELD=<default=false>
option.DEPTH_OF_FIELD.comment=Enable depth of field effect

option.DOF_STRENGTH=<default=0.5> <0.0 0.25 0.5 0.75 1.0>
option.DOF_STRENGTH.comment=Depth of field intensity

option.COLOR_GRADING=<default=true>
option.COLOR_GRADING.comment=Enable color grading and correction

option.SATURATION=<default=1.0> <0.5 0.75 1.0 1.25 1.5>
option.SATURATION.comment=Color saturation multiplier

option.CONTRAST=<default=1.0> <0.5 0.75 1.0 1.25 1.5>
option.CONTRAST.comment=Image contrast

option.BRIGHTNESS=<default=1.0> <0.5 0.75 1.0 1.25 1.5>
option.BRIGHTNESS.comment=Overall brightness

# ============================================
# MATERIAL PROPERTIES
# ============================================
screen=<Material Properties>
option.PBR_ENABLED=<default=true>
option.PBR_ENABLED.comment=Enable physically-based rendering

option.NORMAL_MAPPING=<default=true>
option.NORMAL_MAPPING.comment=Enable normal map detail

option.PARALLAX_MAPPING=<default=true>
option.PARALLAX_MAPPING.comment=Enable parallax occlusion mapping

option.PARALLAX_DEPTH=<default=0.05> <0.01 0.05 0.1 0.2>
option.PARALLAX_DEPTH.comment=Parallax mapping depth

option.SPECULAR_STRENGTH=<default=1.0> <0.0 0.5 1.0 1.5 2.0>
option.SPECULAR_STRENGTH.comment=Specular reflection intensity

option.METALLIC_STRENGTH=<default=1.0> <0.0 0.5 1.0 1.5 2.0>
option.METALLIC_STRENGTH.comment=Metallic surface response

# ============================================
# PERFORMANCE
# ============================================
screen=<Performance>
option.DRAW_DISTANCE=<default=64> <16 32 64 128 256>
option.DRAW_DISTANCE.comment=Shader effect render distance

option.EFFECT_QUALITY=<default=1> <0 1 2 3>
option.EFFECT_QUALITY.comment=Overall effect quality (lower = faster)

value.EFFECT_QUALITY.0=Minimum
value.EFFECT_QUALITY.1=Balanced
value.EFFECT_QUALITY.2=High
value.EFFECT_QUALITY.3=Ultra

option.ADAPTIVE_QUALITY=<default=true>
option.ADAPTIVE_QUALITY.comment=Automatically adjust quality based on FPS

option.FPS_TARGET=<default=60> <30 60 120 144 240>
option.FPS_TARGET.comment=Target FPS for adaptive quality

# ============================================
# ADVANCED
# ============================================
screen=<Advanced Settings>
option.DEBUG_MODE=<default=false>
option.DEBUG_MODE.comment=Enable debug visualization (profiling)

option.SHADER_CACHE=<default=true>
option.SHADER_CACHE.comment=Enable shader caching for faster load times

option.TEMPORAL_AA=<default=true>
option.TEMPORAL_AA.comment=Enable temporal anti-aliasing

option.JITTER=<default=true>
option.JITTER.comment=Enable camera jitter for temporal effects
